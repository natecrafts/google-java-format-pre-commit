- id: google-java-format
  name: google-java-format
  description: Format Java source files with Google Style
  entry: google-java-format --replace
  language: python
  types: [java]
- id: google-java-format-aosp
  name: google-java-format-aosp
  description: Format Java source files with AOSP Style (4-space indentation)
  entry: google-java-format --replace --aosp
  language: python
  types: [java]
