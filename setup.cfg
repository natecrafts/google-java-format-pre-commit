[metadata]
name = google_java_format_pre_commit
version = 2.0.0
description = Python wrapper invoking google-java-format (https://github.com/google/google-java-format)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/natecrafts/google-java-format-pre-commit
author = Nhat Nguyen
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [google-java-format]
    group = google-java-format-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_linux-arm64
    sha256 = 3193ae2e3a32634a45effc9f575005e7adf202699ab4d9d6488ff1a715588d10
    [google-java-format]
    group = google-java-format-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_linux-x86-64
    sha256 = c351f587e6dd1f11836be7296894ea2ab3bd91847dbd14101f4f04d390380fe9
    [google-java-format]
    group = google-java-format-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_darwin-arm64
    sha256 = 04b13ad486bcc29ef64f7168c2d3eb330e73ae458610ba5bcf44f6018b655dc4
    [google-java-format.exe]
    group = google-java-format-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    marker = sys_platform == "cygwin" and platform_machine == "x86_64"
    url = https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_windows-x86-64.exe
    sha256 = 6e757021d3b5a8133ca3b5b1915c4cf38dc46ad0886bc9059fcc2ccb7b6036e5
